
networks:
  myroutine_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:
  # ─────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: myroutine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-myroutine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${DB_NAME:-myroutine_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myroutine_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myroutine} -d ${DB_NAME:-myroutine_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: myroutine_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myroutine_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # API — Go backend (migrations run on startup)
  # ─────────────────────────────────────
  api:
    build:
      context: ./backend
    container_name: myroutine_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      DATABASE_URL: postgres://${DB_USER:-myroutine}:${DB_PASSWORD:-changeme_in_production}@postgres:5432/${DB_NAME:-myroutine_db}?sslmode=disable
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-myroutine}
      DB_NAME: ${DB_NAME:-myroutine_db}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myroutine_net

  # ─────────────────────────────────────
  # Frontend — React SPA served by nginx
  # ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: myroutine_frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - myroutine_net

  # ─────────────────────────────────────
  # Nginx — Reverse Proxy
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: myroutine_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - myroutine_net

  # ─────────────────────────────────────
  # Prometheus — Métricas
  # ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: myroutine_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - myroutine_net

  # ─────────────────────────────────────
  # Grafana — Dashboards
  # ─────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: myroutine_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - myroutine_net
