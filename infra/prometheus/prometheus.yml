global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "myroutine-backend"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

# Postgres and Redis do not speak the Prometheus protocol on their own — they
# need postgres_exporter / redis_exporter sidecars. Scraping :5432 and :6379
# directly only produces permanently failing targets, so those jobs are left
# out until the exporters are actually added.
