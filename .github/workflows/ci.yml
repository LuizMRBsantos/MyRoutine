name: CI — Build, Test & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. SECRET SCANNING — Detecta secrets vazados em commits
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: 🔑 Secret Scanning (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # 2. BACKEND — Go build, test, SAST
  # ─────────────────────────────────────────────────────────────
  backend:
    name: 🦫 Backend (Go)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download
        working-directory: backend

      - name: Verify dependencies (no tampering)
        run: go mod verify
        working-directory: backend

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: backend

      - name: Build
        run: go build ./...
        working-directory: backend

      # The Vercel Function (repo-root api/index.go) is its own Go module that
      # pulls in ./backend through a replace; make sure it stays buildable and
      # its go.mod/go.sum stay tidy.
      - name: Build Vercel function
        run: |
          go mod tidy -diff
          go vet ./api/
          go build ./api/

      - name: Vet
        run: go vet ./...
        working-directory: backend

      # Integration tests spin up Postgres via testcontainers, using the
      # Docker daemon already present on the runner.
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        working-directory: backend
        env:
          # Os pacotes de teste rodam em paralelo e compartilham a sessão do
          # Ryuk; quando o handshake falha, ele derruba o Postgres de outro
          # pacote no meio da suíte. O runner é descartável e os testes já
          # encerram seus containers no cleanup.
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out

      # SAST — Static Application Security Testing
      - name: Run Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # Dependency vulnerability scan
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: backend

      # Static analysis
      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          working-directory: backend

  # ─────────────────────────────────────────────────────────────
  # 3. FRONTEND — Node build, test, audit
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: ⚛️  Frontend (React + Vite)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm run test:ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # Dependency audit
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend

  # ─────────────────────────────────────────────────────────────
  # 4. MOBILE — Expo type check e testes do parser
  # ─────────────────────────────────────────────────────────────
  mobile:
    name: 📱 Mobile (Expo)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Type check
        run: npx tsc --noEmit
        working-directory: mobile

      # The bullet-journal parser is the entry point of everything the app
      # pushes to the server, so it is the piece that must stay correct.
      - name: Run tests
        run: npm test
        working-directory: mobile

  # ─────────────────────────────────────────────────────────────
  # 5. CONTAINER SECURITY — Trivy scan nas imagens Docker
  # ─────────────────────────────────────────────────────────────
  container-scan:
    name: 🐳 Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # O token padrão do repositório é somente leitura; o upload do SARIF
    # para o GitHub Security precisa de escrita em security-events.
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myroutine-${{ matrix.name }}:${{ github.sha }} .
        working-directory: ${{ matrix.context }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "myroutine-${{ matrix.name }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-${{ matrix.name }}.sarif"
          severity: "CRITICAL,HIGH"
          # Sem isso, o formato SARIF ignora o filtro acima e qualquer achado
          # (inclusive UNKNOWN sem correção) faz o exit-code disparar.
          limit-severities-for-sarif: true
          exit-code: "1"  # Falha o CI se encontrar CRITICAL ou HIGH

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-${{ matrix.name }}.sarif"
          category: "trivy-${{ matrix.name }}"

  # ─────────────────────────────────────────────────────────────
  # 5. SUMMARY — Badge de segurança
  # ─────────────────────────────────────────────────────────────
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, backend, frontend, mobile, container-scan]
    if: always()

    steps:
      - name: Security Gate
        run: |
          echo "## Security Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend SAST | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Audit | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile | ${{ needs.mobile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
